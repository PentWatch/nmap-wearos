name: Build and Release

on:
  push:
    tags:
      - "v1*"
  workflow_dispatch:

permissions:
  contents: write

env:
  ANDROID_API: "24"
  ANDROID_ABI: arm64-v8a
  NDK_VERSION: r27b

jobs:
  build:
    name: Build Android binaries
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Install build dependencies
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            make \
            gcc \
            g++ \
            clang \
            autoconf \
            automake \
            libtool \
            pkg-config \
            cmake \
            ninja-build \
            python3 \
            wget \
            unzip \
            file \
            binutils \
            zip

      - name: Install Android NDK
        shell: bash
        run: |
          set -euo pipefail

          cd "$HOME"

          wget -q \
            "https://dl.google.com/android/repository/android-ndk-${NDK_VERSION}-linux.zip"

          unzip -q \
            "android-ndk-${NDK_VERSION}-linux.zip"

          echo "NDK_HOME=$HOME/android-ndk-${NDK_VERSION}" >> "$GITHUB_ENV"
          echo "TOOLCHAIN=$HOME/android-ndk-${NDK_VERSION}/toolchains/llvm/prebuilt/linux-x86_64" >> "$GITHUB_ENV"

      - name: Configure Android toolchain
        shell: bash
        run: |
          set -euo pipefail

          echo "PATH=$TOOLCHAIN/bin:$PATH" >> "$GITHUB_ENV"

          echo "CC=$TOOLCHAIN/bin/aarch64-linux-android${ANDROID_API}-clang" >> "$GITHUB_ENV"
          echo "CXX=$TOOLCHAIN/bin/aarch64-linux-android${ANDROID_API}-clang++" >> "$GITHUB_ENV"
          echo "AR=$TOOLCHAIN/bin/llvm-ar" >> "$GITHUB_ENV"
          echo "RANLIB=$TOOLCHAIN/bin/llvm-ranlib" >> "$GITHUB_ENV"
          echo "STRIP=$TOOLCHAIN/bin/llvm-strip" >> "$GITHUB_ENV"

      - name: Verify Android toolchain
        shell: bash
        run: |
          set -euo pipefail

          command -v "$CC"
          command -v "$CXX"
          command -v "$AR"
          command -v "$RANLIB"
          command -v "$STRIP"

          "$CC" --version
          "$CXX" --version

      - name: Build BoringSSL
        shell: bash
        run: |
          set -euo pipefail

          git clone --depth 1 https://github.com/google/boringssl.git

          cmake \
            -S boringssl \
            -B boringssl/build \
            -DCMAKE_TOOLCHAIN_FILE="$NDK_HOME/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI="$ANDROID_ABI" \
            -DANDROID_PLATFORM="android-${ANDROID_API}" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$PWD/boringssl/install" \
            -DBUILD_SHARED_LIBS=OFF \
            -DCMAKE_CXX_STANDARD=17 \
            -DCMAKE_CXX_STANDARD_REQUIRED=ON

          cmake --build boringssl/build \
            --target ssl crypto \
            --parallel "$(nproc)"

          echo "Searching for BoringSSL static libraries..."

          SSL_LIB="$(
            find "$PWD/boringssl/build" \
              -type f \
              -name "libssl.a" \
              -print -quit
          )"

          CRYPTO_LIB="$(
            find "$PWD/boringssl/build" \
              -type f \
              -name "libcrypto.a" \
              -print -quit
          )"

          if [[ -z "$SSL_LIB" ]]; then
            echo "ERROR: libssl.a was not found"
            find "$PWD/boringssl/build" -type f -name "*.a" -print
            exit 1
          fi

          if [[ -z "$CRYPTO_LIB" ]]; then
            echo "ERROR: libcrypto.a was not found"
            find "$PWD/boringssl/build" -type f -name "*.a" -print
            exit 1
          fi

          mkdir -p boringssl/lib

          cp "$SSL_LIB" boringssl/lib/libssl.a
          cp "$CRYPTO_LIB" boringssl/lib/libcrypto.a

          echo "BoringSSL libraries prepared:"
          ls -lh boringssl/lib

      - name: Build libpcap
        shell: bash
        run: |
          set -euo pipefail

          cd libpcap

          make distclean 2>/dev/null || true
          rm -f config.cache

          ./configure \
            --host=aarch64-linux-android \
            --without-libnl \
            CC="$CC" \
            AR="$AR" \
            RANLIB="$RANLIB"

          make -j"$(nproc)"

          LIBPCAP_A="$(
            find "$PWD" \
              -type f \
              -name "libpcap.a" \
              -print -quit
          )"

          if [[ -z "$LIBPCAP_A" ]]; then
            echo "ERROR: libpcap.a was not found"
            find "$PWD" -type f -name "*.a" -print
            exit 1
          fi

          echo "Found libpcap: $LIBPCAP_A"

          cd ..

      - name: Configure Nmap
        shell: bash
        run: |
          set -euo pipefail

          # These flags are intentionally limited to the Nmap configure step.
          # Do not export PCRE2-specific library paths globally, because Nmap
          # builds its bundled PCRE2 internally.
          export CPPFLAGS="\
          -I$PWD/libpcap \
          -I$PWD/boringssl/include"

          export LDFLAGS="\
          -L$PWD/libpcap \
          -L$PWD/libpcap/.libs \
          -L$PWD/boringssl/lib \
          -static-libstdc++"

          ./configure \
            --host=aarch64-linux-android \
            --with-libpcap=included \
            --with-libpcre=included \
            --with-openssl="$PWD/boringssl" \
            --disable-zenmap \
            --disable-nmap-update \
            --without-liblua \
            --without-libssh2 \
            --disable-ncat \
            --disable-nping \
            CC="$CC" \
            CXX="$CXX" \
            AR="$AR" \
            RANLIB="$RANLIB" \
            CPPFLAGS="$CPPFLAGS" \
            LDFLAGS="$LDFLAGS" \
            ac_cv_lib_crypto_BIO_int_ctrl=yes \
            ac_cv_lib_ssl_SSL_new=yes \
            ac_cv_func_EVP_sha256=yes

      - name: Build Nmap
        shell: bash
        run: |
          set -euo pipefail

          make -j"$(nproc)" V=1

      - name: Verify Nmap binary
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! -f nmap ]]; then
            echo "ERROR: nmap was not generated"
            exit 1
          fi

          file nmap

          echo "--- Dynamic dependencies ---"
          readelf -d nmap | grep NEEDED || true

          if readelf -d nmap | grep -q "libc++_shared.so"; then
            echo "ERROR: nmap depends on libc++_shared.so"
            exit 1
          fi

          echo "--- Architecture ---"
          "$TOOLCHAIN/bin/llvm-readelf" -h nmap | \
            grep -E "Class:|Machine:|OS/ABI:" || true

      - name: Strip Nmap binary
        shell: bash
        run: |
          set -euo pipefail

          "$STRIP" nmap

      - name: Prepare release package
        shell: bash
        run: |
          set -euo pipefail

          RELEASE_TAG="${GITHUB_REF_NAME:-manual-${GITHUB_RUN_NUMBER}}"

          rm -rf release
          mkdir -p release

          cp nmap release/nmap
          chmod 755 release/nmap

          file release/nmap

          cd release

          zip -9 \
            "nmap-android-${RELEASE_TAG}.zip" \
            nmap

          sha256sum \
            nmap \
            "nmap-android-${RELEASE_TAG}.zip" \
            > SHA256SUMS

          ls -lh

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nmap-android-binaries
          path: release/
          retention-days: 30

  release:
    name: Create GitHub release
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: nmap-android-binaries
          path: release/

      - name: Create GitHub release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: release/*
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
