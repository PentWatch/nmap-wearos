name: Build and Release

on:
  push:
    tags:
      - "v1*"
  workflow_dispatch:

permissions:
  contents: write

env:
  ANDROID_API: "24"
  ANDROID_ABI: armeabi-v7a
  # Triple usado por el propio compilador clang del NDK (prefijo de los binarios)
  NDK_TARGET: armv7a-linux-androideabi
  # Triple GNU "canonico" que esperan los scripts autoconf (--host=...)
  GNU_HOST_TRIPLE: arm-linux-androideabi
  NDK_VERSION: r27b

jobs:
  build:
    name: Build Android Nmap
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Install build dependencies
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            make \
            gcc \
            g++ \
            clang \
            autoconf \
            automake \
            libtool \
            pkg-config \
            cmake \
            ninja-build \
            python3 \
            wget \
            unzip \
            file \
            binutils \
            zip

      - name: Install Android NDK
        shell: bash
        run: |
          set -euo pipefail

          cd "$HOME"

          wget -q \
            "https://dl.google.com/android/repository/android-ndk-${NDK_VERSION}-linux.zip"

          unzip -q \
            "android-ndk-${NDK_VERSION}-linux.zip"

          echo "NDK_HOME=$HOME/android-ndk-${NDK_VERSION}" >> "$GITHUB_ENV"
          echo "TOOLCHAIN=$HOME/android-ndk-${NDK_VERSION}/toolchains/llvm/prebuilt/linux-x86_64" >> "$GITHUB_ENV"

      - name: Configure Android toolchain
        shell: bash
        run: |
          set -euo pipefail

          echo "PATH=$TOOLCHAIN/bin:$PATH" >> "$GITHUB_ENV"

          # OJO: para armeabi-v7a el clang del NDK usa el prefijo NDK_TARGET
          # (armv7a-linux-androideabi<API>-clang), NO aarch64-linux-android<API>-clang
          echo "CC=$TOOLCHAIN/bin/${NDK_TARGET}${ANDROID_API}-clang" >> "$GITHUB_ENV"
          echo "CXX=$TOOLCHAIN/bin/${NDK_TARGET}${ANDROID_API}-clang++" >> "$GITHUB_ENV"
          echo "AR=$TOOLCHAIN/bin/llvm-ar" >> "$GITHUB_ENV"
          echo "RANLIB=$TOOLCHAIN/bin/llvm-ranlib" >> "$GITHUB_ENV"
          echo "STRIP=$TOOLCHAIN/bin/llvm-strip" >> "$GITHUB_ENV"

      - name: Verify Android toolchain
        shell: bash
        run: |
          set -euo pipefail

          "$CC" --version
          "$CXX" --version
          "$AR" --version
          "$RANLIB" --version

      - name: Build BoringSSL
        shell: bash
        run: |
          set -euo pipefail

          rm -rf boringssl
          git clone --depth 1 https://github.com/google/boringssl.git

          cmake \
            -S boringssl \
            -B boringssl/build \
            -DCMAKE_TOOLCHAIN_FILE="$NDK_HOME/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI="$ANDROID_ABI" \
            -DANDROID_PLATFORM="android-${ANDROID_API}" \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=OFF \
            -DCMAKE_CXX_STANDARD=17 \
            -DCMAKE_CXX_STANDARD_REQUIRED=ON

          cmake --build boringssl/build \
            --target ssl crypto \
            --parallel "$(nproc)"

          SSL_LIB="$(
            find "$PWD/boringssl/build" \
              -type f \
              -name "libssl.a" \
              -print -quit
          )"

          CRYPTO_LIB="$(
            find "$PWD/boringssl/build" \
              -type f \
              -name "libcrypto.a" \
              -print -quit
          )"

          if [[ -z "$SSL_LIB" || -z "$CRYPTO_LIB" ]]; then
            echo "ERROR: BoringSSL static libraries were not found"
            find "$PWD/boringssl/build" -type f -name "*.a" -print
            exit 1
          fi

          mkdir -p boringssl/lib

          cp "$SSL_LIB" boringssl/lib/libssl.a
          cp "$CRYPTO_LIB" boringssl/lib/libcrypto.a

          ls -lh boringssl/lib

      - name: Build libpcap
        shell: bash
        run: |
          set -euo pipefail

          cd libpcap

          make distclean 2>/dev/null || true
          rm -f config.cache

          ./configure \
            --host="$GNU_HOST_TRIPLE" \
            --without-libnl \
            CC="$CC" \
            AR="$AR" \
            RANLIB="$RANLIB"

          make -j"$(nproc)"

          LIBPCAP_A="$(
            find "$PWD" \
              -type f \
              -name "libpcap.a" \
              -print -quit
          )"

          if [[ -z "$LIBPCAP_A" ]]; then
            echo "ERROR: libpcap.a was not found"
            find "$PWD" -type f -name "*.a" -print
            exit 1
          fi

          echo "Found libpcap: $LIBPCAP_A"

          cd ..

      - name: Clean Nmap build files
        shell: bash
        run: |
          set -euo pipefail

          make distclean 2>/dev/null || true

          find . \
            -name "*.o" \
            -o -name "*.lo" \
            -o -name "*.la" \
            -o -name "*.lai" \
            | xargs -r rm -f

      - name: Configure Nmap
        shell: bash
        run: |
          set -euo pipefail

          export CPPFLAGS="\
          -I$PWD/libpcap \
          -I$PWD/boringssl/include"

          export LDFLAGS="\
          -L$PWD/libpcap \
          -L$PWD/libpcap/.libs \
          -L$PWD/boringssl/lib \
          -static-libstdc++"

          ./configure \
            --host="$GNU_HOST_TRIPLE" \
            --with-libpcap=included \
            --with-libpcre=included \
            --with-openssl="$PWD/boringssl" \
            --disable-zenmap \
            --disable-ncat \
            --disable-nping \
            --disable-ndiff \
            --disable-nmap-update \
            --with-liblua=included \
            --without-libssh2 \
            CC="$CC" \
            CXX="$CXX" \
            AR="$AR" \
            RANLIB="$RANLIB" \
            CPPFLAGS="$CPPFLAGS" \
            LDFLAGS="$LDFLAGS" \
            ac_cv_lib_crypto_BIO_int_ctrl=yes \
            ac_cv_lib_ssl_SSL_new=yes \
            ac_cv_func_EVP_sha256=yes

      - name: Build Nmap
        shell: bash
        run: |
          set -euo pipefail

          make -j"$(nproc)" V=1

      - name: Verify Nmap binary
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! -f nmap ]]; then
            echo "ERROR: nmap was not generated"
            exit 1
          fi

          file nmap

          echo "--- Dynamic dependencies ---"
          readelf -d nmap | grep NEEDED || true

          if readelf -d nmap | grep -q "libc++_shared.so"; then
            echo "ERROR: nmap depends on libc++_shared.so"
            exit 1
          fi

          echo "--- Architecture ---"
          "$TOOLCHAIN/bin/llvm-readelf" -h nmap | \
            grep -E "Class:|Machine:|OS/ABI:" || true

          # Chequeo extra: debe ser 32-bit ARM, y NO debe requerir linker64
          if ! file nmap | grep -qi "32-bit.*ARM"; then
            echo "ERROR: el binario no es 32-bit ARM (armeabi-v7a)"
            file nmap
            exit 1
          fi

          if readelf -l nmap 2>/dev/null | grep -q "linker64"; then
            echo "ERROR: el binario referencia /system/bin/linker64 (es de 64-bit)"
            exit 1
          fi

          echo "--- Buscando soporte NSE/lua enlazado en el binario ---"
          # No podemos ejecutar el binario ARM en este runner x86_64,
          # asi que verificamos via simbolos en vez de "./nmap --version"
          #
          # OJO: lua_call() y lua_pcall() son MACROS en lua.h (se expanden a
          # lua_callk()/lua_pcallk()), no funciones reales, asi que NUNCA
          # aparecen como simbolo en el binario. Buscamos las funciones C
          # reales que si quedan como simbolos: luaL_newstate, luaL_openlibs
          # y las variantes _k a las que esos macros se expanden.
          NM_BIN="$TOOLCHAIN/bin/llvm-nm"

          echo "Simbolos relacionados con lua encontrados:"
          "$NM_BIN" nmap 2>/dev/null | grep -i "lua" || true

          if ! "$NM_BIN" nmap 2>/dev/null | grep -qi "luaL_newstate\|luaL_openlibs\|lua_callk\|lua_pcallk"; then
            echo "ERROR: no se encontraron simbolos de lua en el binario, --script no va a funcionar"
            exit 1
          fi

          echo "OK: simbolos de liblua presentes (NSE deberia funcionar)"

      - name: Strip Nmap binary
        shell: bash
        run: |
          set -euo pipefail

          "$STRIP" nmap

      - name: Prepare release package
        shell: bash
        run: |
          set -euo pipefail

          RELEASE_TAG="${GITHUB_REF_NAME:-manual-${GITHUB_RUN_NUMBER}}"

          rm -rf release
          mkdir -p release

          cp nmap release/nmap
          chmod 755 release/nmap

          cd release

          zip -9 \
            "nmap-android-armeabi-v7a-${RELEASE_TAG}.zip" \
            nmap

          sha256sum \
            nmap \
            "nmap-android-armeabi-v7a-${RELEASE_TAG}.zip" \
            > SHA256SUMS

          file nmap
          ls -lh

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nmap-android-armeabi-v7a-binaries
          path: release/
          retention-days: 30

  release:
    name: Create GitHub release
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: nmap-android-armeabi-v7a-binaries
          path: release/

      - name: Create GitHub release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: release/*
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
