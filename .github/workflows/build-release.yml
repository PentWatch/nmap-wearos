name: Build and Release

on:
  push:
    tags:
      - "v1*"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

env:
  RELEASE_TAG: v1.0.0
  ANDROID_API: "24"
  ANDROID_ABI: arm64-v8a

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install build dependencies
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            make \
            gcc \
            g++ \
            clang \
            autoconf \
            automake \
            libtool \
            pkg-config \
            cmake \
            ninja-build \
            python3 \
            wget \
            unzip \
            file \
            binutils

      - name: Install Android NDK r27b
        shell: bash
        run: |
          set -euo pipefail

          cd "$HOME"

          wget -q \
            https://dl.google.com/android/repository/android-ndk-r27b-linux.zip

          unzip -q android-ndk-r27b-linux.zip

          echo "NDK_HOME=$HOME/android-ndk-r27b" >> "$GITHUB_ENV"
          echo "TOOLCHAIN=$HOME/android-ndk-r27b/toolchains/llvm/prebuilt/linux-x86_64" >> "$GITHUB_ENV"

      - name: Configure Android toolchain
        shell: bash
        run: |
          set -euo pipefail

          echo "PATH=$TOOLCHAIN/bin:$PATH" >> "$GITHUB_ENV"

          echo "CC=$TOOLCHAIN/bin/aarch64-linux-android${ANDROID_API}-clang" >> "$GITHUB_ENV"
          echo "CXX=$TOOLCHAIN/bin/aarch64-linux-android${ANDROID_API}-clang++" >> "$GITHUB_ENV"
          echo "AR=$TOOLCHAIN/bin/llvm-ar" >> "$GITHUB_ENV"
          echo "RANLIB=$TOOLCHAIN/bin/llvm-ranlib" >> "$GITHUB_ENV"
          echo "STRIP=$TOOLCHAIN/bin/llvm-strip" >> "$GITHUB_ENV"

      - name: Show toolchain versions
        shell: bash
        run: |
          set -euo pipefail

          "$CC" --version
          "$CXX" --version
          cmake --version

      - name: Build BoringSSL
        shell: bash
        run: |
          set -euo pipefail

          git clone --depth 1 https://github.com/google/boringssl.git

          cmake \
            -S boringssl \
            -B boringssl/build \
            -DCMAKE_TOOLCHAIN_FILE="$NDK_HOME/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI="$ANDROID_ABI" \
            -DANDROID_PLATFORM="android-${ANDROID_API}" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$PWD/boringssl/install" \
            -DBUILD_SHARED_LIBS=OFF \
            -DCMAKE_CXX_STANDARD=17 \
            -DCMAKE_CXX_STANDARD_REQUIRED=ON

          cmake --build boringssl/build \
            --target ssl crypto \
            --parallel "$(nproc)"

          echo "Generated BoringSSL files:"

          find boringssl/build \
            -type f \
            \( -name "libssl.a" -o -name "libcrypto.a" \) \
            -print

          SSL_LIB="$(find "$PWD/boringssl/build" \
            -type f \
            -name "libssl.a" \
            -print -quit)"

          CRYPTO_LIB="$(find "$PWD/boringssl/build" \
            -type f \
            -name "libcrypto.a" \
            -print -quit)"

          if [[ -z "$SSL_LIB" ]]; then
            echo "ERROR: libssl.a was not found"
            exit 1
          fi

          if [[ -z "$CRYPTO_LIB" ]]; then
            echo "ERROR: libcrypto.a was not found"
            exit 1
          fi

          mkdir -p boringssl/lib

          cp "$SSL_LIB" boringssl/lib/libssl.a
          cp "$CRYPTO_LIB" boringssl/lib/libcrypto.a

          echo "Prepared BoringSSL libraries:"
          ls -lh boringssl/lib

      - name: Build libpcap
        shell: bash
        run: |
          set -euo pipefail

          cd libpcap

          ./configure \
            --host=aarch64-linux-android \
            --enable-static \
            --disable-shared \
            --without-libnl \
            CC="$CC" \
            AR="$AR" \
            RANLIB="$RANLIB"

          make clean || true
          make -j"$(nproc)"

          if [[ ! -f ".libs/libpcap.a" ]]; then
            echo "ERROR: libpcap.a was not found"
            find . -name "libpcap.a" -print
            exit 1
          fi

          cd ..

      - name: Build PCRE
        shell: bash
        run: |
          set -euo pipefail

          cd libpcre

          ./configure \
            --host=aarch64-linux-android \
            --enable-static \
            --disable-shared \
            CC="$CC" \
            AR="$AR" \
            RANLIB="$RANLIB"

          make clean || true
          make -j"$(nproc)"

          if [[ ! -f ".libs/libpcre.a" ]]; then
            echo "ERROR: libpcre.a was not found"
            find . -name "libpcre.a" -print
            exit 1
          fi

          cd ..

      - name: Configure Nmap
        shell: bash
        run: |
          set -euo pipefail

          export CPPFLAGS="\
          -I$PWD/libpcap \
          -I$PWD/libpcre \
          -I$PWD/libpcre/src \
          -I$PWD/boringssl/include"

          # Do not use -lc++.
          #
          # -static-libstdc++ links the C++ runtime statically
          # and prevents a dependency on libc++_shared.so.
          export LDFLAGS="\
          -L$PWD/libpcap/.libs \
          -L$PWD/libpcre/.libs \
          -L$PWD/boringssl/lib \
          -static-libstdc++"

          ./configure \
            --host=aarch64-linux-android \
            --with-libpcap=included \
            --with-libpcre=included \
            --with-openssl="$PWD/boringssl" \
            --disable-zenmap \
            --disable-nmap-update \
            --without-liblua \
            --without-libssh2 \
            CC="$CC" \
            CXX="$CXX" \
            AR="$AR" \
            RANLIB="$RANLIB" \
            CPPFLAGS="$CPPFLAGS" \
            LDFLAGS="$LDFLAGS" \
            ac_cv_lib_crypto_BIO_int_ctrl=yes \
            ac_cv_lib_ssl_SSL_new=yes \
            ac_cv_func_EVP_sha256=yes

      - name: Build Nmap
        shell: bash
        run: |
          set -euo pipefail

          make -j"$(nproc)" V=1

      - name: Verify generated binaries
        shell: bash
        run: |
          set -euo pipefail

          binaries=(
            "nmap"
            "ncat/ncat"
            "nping/nping"
          )

          for binary in "${binaries[@]}"; do
            echo
            echo "========================================"
            echo "Verifying: $binary"
            echo "========================================"

            if [[ ! -f "$binary" ]]; then
              echo "ERROR: $binary does not exist"
              exit 1
            fi

            file "$binary"

            echo "--- Dynamic dependencies ---"
            readelf -d "$binary" | grep NEEDED || true

            if readelf -d "$binary" | grep -q "libc++_shared.so"; then
              echo "ERROR: $binary still depends on libc++_shared.so"
              exit 1
            fi

            echo "--- Architecture ---"
            "$TOOLCHAIN/bin/llvm-readelf" -h "$binary" | \
              grep -E "Class:|Machine:|OS/ABI:" || true
          done

      - name: Strip binaries
        shell: bash
        run: |
          set -euo pipefail

          "$STRIP" nmap
          "$STRIP" ncat/ncat
          "$STRIP" nping/nping

      - name: Prepare release package
        shell: bash
        run: |
          set -euo pipefail

          rm -rf release
          mkdir -p release

          cp nmap release/nmap
          cp ncat/ncat release/ncat
          cp nping/nping release/nping

          chmod 755 \
            release/nmap \
            release/ncat \
            release/nping

          file \
            release/nmap \
            release/ncat \
            release/nping

          cd release

          zip -9 \
            "nmap-android-${RELEASE_TAG}.zip" \
            nmap \
            ncat \
            nping

          sha256sum \
            nmap \
            ncat \
            nping \
            "nmap-android-${RELEASE_TAG}.zip" \
            > SHA256SUMS

          ls -lh

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nmap-android-binaries
          path: release/
          retention-days: 30

  release:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: nmap-android-binaries
          path: release/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: release/*
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
