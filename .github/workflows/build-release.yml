name: Build and Release

on:
  push:
    tags:
      - "v1*"
  workflow_dispatch:

permissions:
  contents: write

env:
  ANDROID_API: "24"
  ANDROID_ABI: arm64-v8a
  NDK_VERSION: r27b

jobs:
  build:
    name: Build Android binaries
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Install build dependencies
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            make \
            gcc \
            g++ \
            clang \
            autoconf \
            automake \
            libtool \
            pkg-config \
            cmake \
            ninja-build \
            python3 \
            wget \
            unzip \
            file \
            binutils \
            zip

      - name: Install Android NDK
        shell: bash
        run: |
          set -euo pipefail

          cd "$HOME"

          wget -q \
            "https://dl.google.com/android/repository/android-ndk-${NDK_VERSION}-linux.zip"

          unzip -q \
            "android-ndk-${NDK_VERSION}-linux.zip"

          echo "NDK_HOME=$HOME/android-ndk-${NDK_VERSION}" >> "$GITHUB_ENV"
          echo "TOOLCHAIN=$HOME/android-ndk-${NDK_VERSION}/toolchains/llvm/prebuilt/linux-x86_64" >> "$GITHUB_ENV"

      - name: Configure Android toolchain
        shell: bash
        run: |
          set -euo pipefail

          echo "PATH=$TOOLCHAIN/bin:$PATH" >> "$GITHUB_ENV"

          echo "CC=$TOOLCHAIN/bin/aarch64-linux-android${ANDROID_API}-clang" >> "$GITHUB_ENV"
          echo "CXX=$TOOLCHAIN/bin/aarch64-linux-android${ANDROID_API}-clang++" >> "$GITHUB_ENV"
          echo "AR=$TOOLCHAIN/bin/llvm-ar" >> "$GITHUB_ENV"
          echo "RANLIB=$TOOLCHAIN/bin/llvm-ranlib" >> "$GITHUB_ENV"
          echo "STRIP=$TOOLCHAIN/bin/llvm-strip" >> "$GITHUB_ENV"

      - name: Verify Android toolchain
        shell: bash
        run: |
          set -euo pipefail

          command -v "$CC"
          command -v "$CXX"
          command -v "$AR"
          command -v "$RANLIB"
          command -v "$STRIP"

          "$CC" --version
          "$CXX" --version

      - name: Build BoringSSL
        shell: bash
        run: |
          set -euo pipefail

          git clone --depth 1 https://github.com/google/boringssl.git

          cmake \
            -S boringssl \
            -B boringssl/build \
            -DCMAKE_TOOLCHAIN_FILE="$NDK_HOME/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI="$ANDROID_ABI" \
            -DANDROID_PLATFORM="android-${ANDROID_API}" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$PWD/boringssl/install" \
            -DBUILD_SHARED_LIBS=OFF \
            -DCMAKE_CXX_STANDARD=17 \
            -DCMAKE_CXX_STANDARD_REQUIRED=ON

          cmake --build boringssl/build \
            --target ssl crypto \
            --parallel "$(nproc)"

          echo "Searching for BoringSSL static libraries..."

          find "$PWD/boringssl/build" \
            -type f \
            \( -name "libssl.a" -o -name "libcrypto.a" \) \
            -print

          SSL_LIB="$(
            find "$PWD/boringssl/build" \
              -type f \
              -name "libssl.a" \
              -print -quit
          )"

          CRYPTO_LIB="$(
            find "$PWD/boringssl/build" \
              -type f \
              -name "libcrypto.a" \
              -print -quit
          )"

          if [[ -z "$SSL_LIB" ]]; then
            echo "ERROR: libssl.a was not found"
            exit 1
          fi

          if [[ -z "$CRYPTO_LIB" ]]; then
            echo "ERROR: libcrypto.a was not found"
            exit 1
          fi

          mkdir -p boringssl/lib

          cp "$SSL_LIB" boringssl/lib/libssl.a
          cp "$CRYPTO_LIB" boringssl/lib/libcrypto.a

          echo "BoringSSL libraries prepared:"
          ls -lh boringssl/lib

      - name: Build libpcap
        shell: bash
        run: |
          set -euo pipefail

          cd libpcap

          make distclean 2>/dev/null || true
          rm -f config.cache

          ./configure \
            --host=aarch64-linux-android \
            --without-libnl \
            CC="$CC" \
            AR="$AR" \
            RANLIB="$RANLIB"

          make -j"$(nproc)"

          echo "Searching for libpcap.a..."

          LIBPCAP_A="$(
            find "$PWD" \
              -type f \
              -name "libpcap.a" \
              -print -quit
          )"

          if [[ -z "$LIBPCAP_A" ]]; then
            echo "ERROR: libpcap.a was not found"
            find "$PWD" -type f -name "*.a" -print
            exit 1
          fi

          echo "Found libpcap: $LIBPCAP_A"

          cd ..

      - name: Build PCRE
        shell: bash
        run: |
          set -euo pipefail

          cd libpcre

          make distclean 2>/dev/null || true
          rm -f config.cache

          ./configure \
            --host=aarch64-linux-android \
            --enable-static \
            --disable-shared \
            CC="$CC" \
            AR="$AR" \
            RANLIB="$RANLIB"

          make -j"$(nproc)"

          echo "Searching for libpcre.a..."

          LIBPCRE_A="$(
            find "$PWD" \
              -type f \
              -name "libpcre.a" \
              -print -quit
          )"

          if [[ -z "$LIBPCRE_A" ]]; then
            echo "ERROR: libpcre.a was not found"
            find "$PWD" -type f -name "*.a" -print
            exit 1
          fi

          echo "Found libpcre: $LIBPCRE_A"

          cd ..

      - name: Prepare dependency paths
        shell: bash
        run: |
          set -euo pipefail

          LIBPCAP_A="$(
            find "$PWD/libpcap" \
              -type f \
              -name "libpcap.a" \
              -print -quit
          )"

          LIBPCRE_A="$(
            find "$PWD/libpcre" \
              -type f \
              -name "libpcre.a" \
              -print -quit
          )"

          if [[ -z "$LIBPCAP_A" ]]; then
            echo "ERROR: libpcap.a was not found"
            exit 1
          fi

          if [[ -z "$LIBPCRE_A" ]]; then
            echo "ERROR: libpcre.a was not found"
            exit 1
          fi

          echo "LIBPCAP_DIR=$(dirname "$LIBPCAP_A")" >> "$GITHUB_ENV"
          echo "LIBPCRE_DIR=$(dirname "$LIBPCRE_A")" >> "$GITHUB_ENV"

          echo "LIBPCAP_DIR=$(dirname "$LIBPCAP_A")"
          echo "LIBPCRE_DIR=$(dirname "$LIBPCRE_A")"

      - name: Configure Nmap
        shell: bash
        run: |
          set -euo pipefail

          export CPPFLAGS="\
          -I$PWD/libpcap \
          -I$PWD/libpcre \
          -I$PWD/libpcre/src \
          -I$PWD/boringssl/include"

          export LDFLAGS="\
          -L$LIBPCAP_DIR \
          -L$LIBPCRE_DIR \
          -L$PWD/boringssl/lib \
          -static-libstdc++"

          ./configure \
            --host=aarch64-linux-android \
            --with-libpcap="$LIBPCAP_DIR" \
            --with-libpcre="$LIBPCRE_DIR" \
            --with-openssl="$PWD/boringssl" \
            --disable-zenmap \
            --disable-nmap-update \
            --without-liblua \
            --without-libssh2 \
            CC="$CC" \
            CXX="$CXX" \
            AR="$AR" \
            RANLIB="$RANLIB" \
            CPPFLAGS="$CPPFLAGS" \
            LDFLAGS="$LDFLAGS" \
            ac_cv_lib_crypto_BIO_int_ctrl=yes \
            ac_cv_lib_ssl_SSL_new=yes \
            ac_cv_func_EVP_sha256=yes

      - name: Build Nmap
        shell: bash
        run: |
          set -euo pipefail

          make -j"$(nproc)" V=1

      - name: Verify generated binaries
        shell: bash
        run: |
          set -euo pipefail

          binaries=(
            "nmap"
            "ncat/ncat"
            "nping/nping"
          )

          for binary in "${binaries[@]}"; do
            echo
            echo "========================================"
            echo "Verifying: $binary"
            echo "========================================"

            if [[ ! -f "$binary" ]]; then
              echo "ERROR: $binary does not exist"
              exit 1
            fi

            file "$binary"

            echo "--- Dynamic dependencies ---"
            readelf -d "$binary" | grep NEEDED || true

            if readelf -d "$binary" | grep -q "libc++_shared.so"; then
              echo "ERROR: $binary depends on libc++_shared.so"
              exit 1
            fi

            echo "--- Architecture ---"
            "$TOOLCHAIN/bin/llvm-readelf" -h "$binary" | \
              grep -E "Class:|Machine:|OS/ABI:" || true
          done

      - name: Strip binaries
        shell: bash
        run: |
          set -euo pipefail

          "$STRIP" nmap
          "$STRIP" ncat/ncat
          "$STRIP" nping/nping

      - name: Prepare release package
        shell: bash
        run: |
          set -euo pipefail

          RELEASE_TAG="${GITHUB_REF_NAME:-manual-${GITHUB_RUN_NUMBER}}"

          rm -rf release
          mkdir -p release

          cp nmap release/nmap
          cp ncat/ncat release/ncat
          cp nping/nping release/nping

          chmod 755 \
            release/nmap \
            release/ncat \
            release/nping

          echo "Release binaries:"
          file \
            release/nmap \
            release/ncat \
            release/nping

          cd release

          zip -9 \
            "nmap-android-${RELEASE_TAG}.zip" \
            nmap \
            ncat \
            nping

          sha256sum \
            nmap \
            ncat \
            nping \
            "nmap-android-${RELEASE_TAG}.zip" \
            > SHA256SUMS

          echo "Release package contents:"
          ls -lh

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nmap-android-binaries
          path: release/
          retention-days: 30

  release:
    name: Create GitHub release
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: nmap-android-binaries
          path: release/

      - name: Create GitHub release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: release/*
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
